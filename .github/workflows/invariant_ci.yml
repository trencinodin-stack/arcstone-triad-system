name: Rust Invariants CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-rust-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: thumbv7em-none-eabihf # #![no_std] verification target

      - name: Check Rust Invariant Traits (Host)
        run: cargo check --manifest-path Cargo.toml

      - name: Check Bare-Metal #![no_std] Target
        run: cargo check --manifest-path Cargo.toml --target thumbv7em-none-eabihf

name: UEDO Schema & Manifest Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JSON Schema Validator
        run: npm install -g ajv-cli ajv-formats

      - name: Validate UEDO Schema Compilation
        run: ajv compile --spec=draft2020 -c ajv-formats -s core/uedo/uedo.schema.json

      - name: Validate System Manifest JSON Syntax
        run: npx jsonlint -q machine/system-manifest.json
